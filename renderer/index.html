<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoViagem</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <nav>
      <h1>AutoViagem<i class="bi bi-fuel-pump"></i></h1>
    </nav>
  
  <div class="d-flex justify-content-center align-items-start" style="min-height: 100vh; gap: 40px; padding-top: 60px;">
  
  <!-- Div esquerda -->
  <div class="d-flex flex-column align-items-center" style="width: 300px;">
    <input class="form-control mb-2" id="Consumo" type="number" placeholder="Consumo km/l"/>
    <input class="form-control mb-2" id="Litros" type="number" placeholder="Capacidade do tanque/L"/>
    <button class="btn btn-success mb-2" style="width: 250px; padding: 10px;" onclick="calcular()">Calcular</button>
    <div id="resultado" class="resultado-box" style="display: none; width: 250px; padding: 10px; margin-top: 10px;"></div>
    <div id="historico"></div>
  </div>

  <!-- Div direita -->
  <div class="d-flex flex-column align-items-center" style="width: 300px;">
    <input class="form-control mb-2" id="Valor" type="number" placeholder="Valor do combustível"/>
    <input class="form-control mb-2" id="Lit" type="number" placeholder="Litros"/>
    <button class="btn btn-success mb-2" style="width: 250px; padding: 10px;" onclick="calcularValor()">Calcular</button>
    <div id="ResultadoValor" class="resultado-box" style="display: none; width: 250px; padding: 10px; margin-top: 10px;"></div>
     <div id="historicoValor"></div>
  </div>

</div>
    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
