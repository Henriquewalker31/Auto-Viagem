<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoViagem</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  </head>
  <body>
    <nav>
      <h1>AutoViagem<i class="bi bi-fuel-pump"></i></h1>
    </nav>

    <div
      class="d-flex justify-content-center aling-items-center"
      style="height: 100vh; margin-top: 60px"
    >
      <div id="Form">
        <input
          class="form-control"
          id="Consumo"
          type="text"
          placeholder="Consumo km/l"
        />
        <input
          class="form-control"
          id="Litros"
          type="text"
          placeholder="Capacidade do tanque/L"
        />
        <button
          class="btn btn-success w-100"
          style="width: 250px; margin: 10px auto; padding: 10px"
          onclick="calcular()"
        >
          Calcular
        </button>
        <div
          id="resultado"
          class="resultado-box"
          style="display: none; width: 250px; margin: 10px auto; padding: 10px"
        ></div>
        <div id="historico">

        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
